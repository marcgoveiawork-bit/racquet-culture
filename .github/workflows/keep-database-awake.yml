# Keeps the OneCourt Supabase database from pausing on the free plan
# (free projects pause after about a week with no activity).
# Once a day it makes one tiny read using the public anon key that the app
# already ships in config.js, so no secrets are needed.
# Safe to delete once the project is on Supabase Pro.
name: Keep database awake

on:
  schedule:
    - cron: '17 3 * * *'   # every day at 03:17 UTC (08:47 in India)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from the database
        env:
          SUPABASE_URL: https://snormmbkocezylbhzurh.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ihxSJ3hsAnZCY8bz8Z565A_xYx-1vbt
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/rc_ads?select=venue&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              cat body.json; echo
              echo "Database is awake."
              exit 0
            fi
            cat body.json; echo
            sleep 30
          done
          echo "::error::Database did not answer. Check the project at https://supabase.com/dashboard/project/snormmbkocezylbhzurh"
          exit 1
